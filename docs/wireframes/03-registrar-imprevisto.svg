<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="480" height="760" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="240" y="40" text-anchor="middle" font-size="18" font-weight="bold">Registrar imprevisto (HU-01)</text>
  <text x="240" y="62" text-anchor="middle" font-size="13" fill="#555555">Despacho #1003 · Faena Minera Los Bronces</text>

  <text x="40" y="105" font-size="14">Tipo de imprevisto</text>
  <rect x="40" y="115" width="400" height="36" fill="#f4f4f4" stroke="#999999"/>
  <text x="55" y="138" font-size="13" fill="#777777">Carga no lista / Retraso / Camión en espera</text>

  <text x="40" y="180" font-size="14">Descripción</text>
  <rect x="40" y="190" width="400" height="70" fill="#f4f4f4" stroke="#999999"/>
  <text x="55" y="215" font-size="12" fill="#777777">Camión queda en espera por protocolo</text>
  <text x="55" y="232" font-size="12" fill="#777777">de seguridad en el acceso al polvorín</text>

  <rect x="40" y="285" width="400" height="44" rx="6" fill="#dddddd" stroke="#333333"/>
  <text x="240" y="312" text-anchor="middle" font-size="16" font-weight="bold">Confirmar</text>

  <line x1="40" y1="350" x2="440" y2="350" stroke="#cccccc"/>
  <text x="40" y="378" font-size="13" font-weight="bold">Escenario principal: imprevisto registrado</text>

  <rect x="40" y="392" width="400" height="140" fill="#f9f9f9" stroke="#bbbbbb"/>
  <text x="55" y="415" font-size="14" font-weight="bold">Folio: 5003</text>
  <text x="55" y="440" font-size="13">Avisados:</text>
  <text x="70" y="460" font-size="13">Jefe de Operaciones — Enviado</text>
  <text x="70" y="480" font-size="13">Conductor — Enviado</text>

  <line x1="40" y1="560" x2="440" y2="560" stroke="#cccccc"/>
  <text x="40" y="588" font-size="13" font-weight="bold">Escenario alternativo: falta un dato</text>
  <rect x="40" y="602" width="400" height="80" fill="#fff4f4" stroke="#cc8888"/>
  <text x="55" y="625" font-size="12">"Falta seleccionar el tipo de imprevisto"</text>
  <text x="55" y="645" font-size="12" fill="#777777">Se mantiene en la pantalla de registro con</text>
  <text x="55" y="663" font-size="12" fill="#777777">los datos ya ingresados (descripción no se pierde).</text>
</svg>
