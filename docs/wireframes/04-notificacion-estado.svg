<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 700" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="480" height="700" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="240" y="40" text-anchor="middle" font-size="18" font-weight="bold">Aviso por correo (HU-03 / HU-04)</text>

  <rect x="40" y="60" width="400" height="150" fill="#f4f8ff" stroke="#99a9cc"/>
  <text x="55" y="85" font-size="13" font-weight="bold">Para: jefe de operaciones / conductor</text>
  <text x="55" y="110" font-size="13">Folio: 5003</text>
  <text x="55" y="130" font-size="13">Planta: Faena Minera Los Bronces</text>
  <text x="55" y="150" font-size="13">Despacho: #1003</text>
  <text x="55" y="170" font-size="13">Cambio: Camión en espera</text>
  <text x="55" y="195" font-size="12" fill="#777777">"Camión queda en espera en el acceso al polvorín..."</text>

  <line x1="40" y1="240" x2="440" y2="240" stroke="#cccccc"/>
  <text x="40" y="268" text-anchor="start" font-size="15" font-weight="bold">Estado de los avisos (HU-05)</text>
  <text x="40" y="286" font-size="12" fill="#555555">Folio 5003</text>

  <rect x="40" y="300" width="400" height="44" fill="#f0fff0" stroke="#88bb88"/>
  <text x="55" y="326" font-size="13">Jefe de Operaciones — Enviado</text>

  <rect x="40" y="350" width="400" height="44" fill="#fff0f0" stroke="#cc8888"/>
  <text x="55" y="376" font-size="13">Conductor — Fallido (reintentar)</text>

  <text x="40" y="420" font-size="12" fill="#777777">El despachador usa este estado para saber a</text>
  <text x="40" y="438" font-size="12" fill="#777777">quién debe contactar directamente.</text>
</svg>
